{% load static %}
<!DOCTYPE html>
<html lang="es" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Tienda de Videojuegos{% endblock title %}</title>

    <!-- CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"/>
    <link rel="stylesheet" href="{% static "css/style.css" %}">
    
    <!-- Scripts -->
    <script src="{% static "js/script.js" %}"></script>
     
</head>
<body class="bg-body text-body">
    <header class="d-flex justify-content-between align-items-center p-3 border-bottom">
        <button id="toggle-theme" class="btn btn-outline-secondary rounded-circle shadow-sm d-flex align-items-center" style="width: 45px; height: 45px; transition: all 0.3s ease;"><i class="fa-solid fa-circle-half-stroke"></i></button>
    </header>
    {% block content %}
    <!-- Aqui Ira el contenido especifico de cada pagina -->
    {% endblock content %}

    <footer class="text-center mt-5 mb-3">
        <p> 2025 Tienda de Videojuegos</p>
        <a href="{% url "home" %}" class="text-body">Inicio</a>
        <a href="{% url "contacto" %}" class="text-body ms-3">Contacto</a>
    </footer>
</body>
</html>
